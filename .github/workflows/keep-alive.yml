name: Keep backend awake

# Render's free plan puts the backend to sleep after 15 minutes without
# traffic, and waking it takes 30 to 60 seconds. Pinging every 10 minutes
# keeps it awake for visitors.
#
# It only runs from 02:00 to 18:59 UTC (7:30 am to 12:29 am IST). Running
# all day would use about 744 of the 750 free Render hours each month, and
# running out suspends the service until the next month. This window uses
# about 530 hours and leaves room to spare.
#
# GitHub can delay scheduled runs by a few minutes when it's busy, which is
# why the interval is 10 minutes and not 14.

on:
  schedule:
    - cron: "*/10 2-18 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health endpoint
        run: |
          curl --fail --silent --show-error \
            --max-time 90 --retry 3 --retry-delay 10 \
            https://ats-resume-builder-7bj7.onrender.com/api/health
